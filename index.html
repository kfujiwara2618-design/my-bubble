<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Bubble, Flare & Rainbow HD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み (人物認識用) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">MODEL LOADING...</span> | JPG保存 | 顔認識エフェクト回避
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識 (Face-api.js) の実装 ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);

      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズームの実装 ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- Canvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクト強弱設定（5段階：0=Off, 1=Min, 2=Low, 3=Mid, 4=Max） ---
    let effectPowerLevel = 3; // 初期値：Mid(3)
    const powerNames = { 0: 'Off', 1: 'Min', 2: 'Low', 3: 'Mid', 4: 'Max' };

    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel + 1) % 5;
      document.getElementById('effect-btn').textContent = `FX: ${powerNames[effectPowerLevel]}`;
    }

    // --- 泡 (Bubble) & レンズフレア パーティクルシステム ---
    const particles = [];
    let timeCount = 0;

    const bubbleRimColors = [
      'rgba(255, 235, 190, ', 
      'rgba(228, 195, 139, ', 
      'rgba(255, 255, 255, ', 
      'rgba(200, 230, 255, '
    ];

    for (let i = 0; i < 110; i++) {
      const isFlare = Math.random() < 0.35;
      particles.push({
        type: isFlare ? 'flare' : 'bubble',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: isFlare ? (Math.random() * 25 + 10) : (Math.random() * 30 + 8),
        speedY: isFlare ? (Math.random() * 0.4 + 0.1) : (Math.random() * 1.5 + 0.5),
        speedX: (Math.random() - 0.5) * 0.8,
        opacity: Math.random() * 0.6 + 0.3,
        baseOpacity: Math.random() * 0.5 + 0.4,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        colorPrefix: bubbleRimColors[Math.floor(Math.random() * bubbleRimColors.length)],
        onFace: false
      });
    }

    // --- 泡を描画 ---
    function drawBubble(ctx, x, y, size, colorPrefix, opacity, onFace) {
      ctx.save();
      ctx.translate(x, y);

      const alpha = onFace ? opacity * 0.1 : opacity;

      const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.05, 0, 0, size);
      grad.addColorStop(0, 'rgba(255, 255, 255, ' + (alpha * 0.8) + ')');
      grad.addColorStop(0.4, colorPrefix + (alpha * 0.25) + ')');
      grad.addColorStop(0.85, colorPrefix + (alpha * 0.55) + ')');
      grad.addColorStop(1, 'rgba(255, 255, 255, ' + (alpha * 0.9) + ')');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.85) + ')';
      ctx.beginPath();
      ctx.arc(-size * 0.38, -size * 0.38, size * 0.22, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- レンズフレアを描画 ---
    function drawLensFlare(ctx, x, y, size, colorPrefix, opacity, twinklePhase, onFace) {
      ctx.save();
      ctx.translate(x, y);

      const twinkle = Math.sin(timeCount * 3 + twinklePhase) * 0.3 + 0.7;
      const currentOpacity = (onFace ? opacity * 0.1 : opacity) * twinkle;

      ctx.globalCompositeOperation = 'screen';

      const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.5);
      glowGrad.addColorStop(0, colorPrefix + (currentOpacity * 0.9) + ')');
      glowGrad.addColorStop(0.5, colorPrefix + (currentOpacity * 0.3) + ')');
      glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (currentOpacity * 0.95) + ')';
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(-size * 2.2, 0); ctx.lineTo(size * 2.2, 0);
      ctx.moveTo(0, -size * 2.2); ctx.lineTo(0, size * 2.2);
      ctx.stroke();

      ctx.strokeStyle = colorPrefix + (currentOpacity * 0.5) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-size * 1.1, -size * 1.1); ctx.lineTo(size * 1.1, size * 1.1);
      ctx.moveTo(size * 1.1, -size * 1.1); ctx.lineTo(-size * 1.1, size * 1.1);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- ラグジュアリーな虹（Rainbow）を描画 ---
    function drawRainbow(ctx, width, height, alpha) {
      if (alpha <= 0) return;

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      const centerX = width * 0.5;
      const centerY = height * 1.35;
      const radius = Math.max(width, height) * 0.9;
      const arcWidth = 35;

      const rainbowGrad = ctx.createRadialGradient(
        centerX, centerY, radius - arcWidth,
        centerX, centerY, radius + arcWidth
      );

      rainbowGrad.addColorStop(0.00, `rgba(255, 0, 0, 0)`);
      rainbowGrad.addColorStop(0.15, `rgba(255, 50, 50, ${0.45 * alpha})`);
      rainbowGrad.addColorStop(0.30, `rgba(255, 165, 0, ${0.4 * alpha})`);
      rainbowGrad.addColorStop(0.45, `rgba(255, 255, 0, ${0.45 * alpha})`);
      rainbowGrad.addColorStop(0.60, `rgba(50, 205, 50, ${0.4 * alpha})`);
      rainbowGrad.addColorStop(0.75, `rgba(30, 144, 255, ${0.45 * alpha})`);
      rainbowGrad.addColorStop(0.90, `rgba(138, 43, 226, ${0.35 * alpha})`);
      rainbowGrad.addColorStop(1.00, `rgba(238, 130, 238, 0)`);

      ctx.fillStyle = rainbowGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius + arcWidth, Math.PI * 1.1, Math.PI * 1.9);
      ctx.arc(centerX, centerY, radius - arcWidth, Math.PI * 1.9, Math.PI * 1.1, true);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- 10秒周期タイマーロジック ---
      // cycleTime: 0～10秒
      const cycleTime = timeCount % 10; 

      // 虹のフェード計算（最初の3秒間現れて消える）
      let rainbowAlpha = 0;
      if (cycleTime < 3.0) {
        rainbowAlpha = Math.sin((cycleTime / 3.0) * Math.PI); // 0 -> 1 -> 0 へ滑らかに変化
      }

      // エフェクト強度の計算
      let activeMultiplier = 0;
      if (effectPowerLevel === 0) {
        activeMultiplier = 0; // Off
      } else if (effectPowerLevel === 1) {
        // Min設定：10秒周期の虹が出現している3秒間のみ泡・フレアが出現し、消失する
        activeMultiplier = rainbowAlpha * 0.5;
      } else if (effectPowerLevel === 2) {
        activeMultiplier = 0.4; // Low
      } else if (effectPowerLevel === 3) {
        activeMultiplier = 0.8; // Mid
      } else if (effectPowerLevel === 4) {
        activeMultiplier = 1.3; // Max
      }

      // 虹の描画（FX: Off 以外で10秒周期で出現）
      if (effectPowerLevel > 0 && rainbowAlpha > 0) {
        drawRainbow(ctx, logicalWidth, logicalHeight, rainbowAlpha);
      }

      // パーティクルの描画
      if (activeMultiplier > 0) {
        particles.forEach((p) => {
          if (p.type === 'bubble') {
            p.y -= p.speedY * (effectPowerLevel === 1 ? 0.8 : activeMultiplier);
            p.x += Math.sin(timeCount * 2 + p.twinklePhase) * 0.6;
          } else {
            p.y -= p.speedY * (effectPowerLevel === 1 ? 0.4 : activeMultiplier * 0.5);
            p.x += p.speedX * 0.3;
          }

          if (p.y < -50 || p.x < -50 || p.x > logicalWidth + 50) {
            p.y = logicalHeight + 40;
            p.x = Math.random() * logicalWidth;
            p.colorPrefix = bubbleRimColors[Math.floor(Math.random() * bubbleRimColors.length)];
          }

          // 顔認識回避ロジック
          p.onFace = false;
          if (faces.length > 0) {
            for (const face of faces) {
              const { x, y, width, height } = face.box;
              if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
                p.onFace = true;
                break;
              }
            }
          }

          const currentOpacity = p.opacity * (effectPowerLevel === 1 ? rainbowAlpha : 1.0);

          if (p.type === 'bubble') {
            drawBubble(ctx, p.x, p.y, p.size, p.colorPrefix, currentOpacity, p.onFace);
          } else {
            drawLensFlare(ctx, p.x, p.y, p.size, p.colorPrefix, p.baseOpacity * (effectPowerLevel === 1 ? rainbowAlpha : 1.0), p.twinklePhase, p.onFace);
          }
        });
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像の切り抜き合成
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. ARレイヤー（泡・フレア・虹）の合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPG保存
      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.92);
      const link = document.createElement('a');
      link.download = 'luxury_pro_ar_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED (Check Library)";

      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 3000);
    });

    initCamera();

  </script>
</body>
</html>
