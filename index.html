<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Bubble & Flare HD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み (人物認識用) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">MODEL LOADING...</span> | JPG保存 | 顔認識エフェクト回避
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = []; // 認識された顔の情報を格納する配列

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識 (Face-api.js) の実装 ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);

      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズームの実装 ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- 高解像度 (Retina) 対応のCanvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクト強弱設定 ---
    let effectPowerLevel = 2; // 1: Low, 2: Mid, 3: High
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    // --- 泡 (Bubble) & レンズフレア パーティクルシステム ---
    const particles = [];
    let timeCount = 0;

    const bubbleRimColors = [
      'rgba(255, 235, 190, ', 
      'rgba(228, 195, 139, ', 
      'rgba(255, 255, 255, ', 
      'rgba(200, 230, 255, '
    ];

    for (let i = 0; i < 90; i++) {
      const isFlare = Math.random() < 0.35;
      particles.push({
        type: isFlare ? 'flare' : 'bubble',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: isFlare ? (Math.random() * 25 + 10) : (Math.random() * 30 + 8),
        speedY: isFlare ? (Math.random() * 0.4 + 0.1) : (Math.random() * 1.5 + 0.5),
        speedX: (Math.random() - 0.5) * 0.8,
        opacity: Math.random() * 0.6 + 0.3,
        baseOpacity: Math.random() * 0.5 + 0.4,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        colorPrefix: bubbleRimColors[Math.floor(Math.random() * bubbleRimColors.length)],
        onFace: false
      });
    }

    // --- 水鉄砲 (Water Gun) 管理オブジェクト ---
    const waterGun = {
      active: false,
      progress: 0,       // 登場アニメーション進捗 (0~1)
      timer: 0,          // 10秒ごとのタイマー
      duration: 3.5,     // 水鉄砲が現れて噴射して消えるまでの時間(秒)
      shootTimer: 0,
      angle: -Math.PI / 4,
      gunX: 0,
      gunY: 0,
      nozzleX: 0,
      nozzleY: 0
    };

    // 水鉄砲から吐き出される特製バブルアレイ
    const shotBubbles = [];

    function emitGunBubbles(nx, ny) {
      for (let i = 0; i < 4; i++) {
        const spread = (Math.random() - 0.5) * 0.6;
        const speed = Math.random() * 6 + 4;
        const angle = waterGun.angle + spread;
        shotBubbles.push({
          x: nx,
          y: ny,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 18 + 6,
          opacity: 0.9,
          colorPrefix: bubbleRimColors[Math.floor(Math.random() * bubbleRimColors.length)],
          onFace: false
        });
      }
    }

    // ラグジュアリーゴールド水鉄砲の描画
    function drawWaterGun(ctx, width, height) {
      if (!waterGun.active) return;

      const offset = Math.sin(waterGun.progress * Math.PI) * 140; // 右下からスライドイン
      const baseGunX = width - offset + 20;
      const baseGunY = height - offset * 0.7 + 20;

      waterGun.gunX = baseGunX;
      waterGun.gunY = baseGunY;

      // ノズル先端の計算
      const length = 90;
      waterGun.nozzleX = baseGunX + Math.cos(waterGun.angle) * length;
      waterGun.nozzleY = baseGunY + Math.sin(waterGun.angle) * length;

      ctx.save();
      ctx.translate(baseGunX, baseGunY);
      ctx.rotate(waterGun.angle);

      // 1. 水鉄砲ボディ（高級感あふれるグラデーション）
      const gunGrad = ctx.createLinearGradient(0, -15, 0, 15);
      gunGrad.addColorStop(0, '#fceabb');
      gunGrad.addColorStop(0.5, '#f8b500');
      gunGrad.addColorStop(1, '#c48900');

      // 銃身
      ctx.fillStyle = gunGrad;
      ctx.beginPath();
      ctx.roundRect(0, -12, 85, 24, [4, 12, 12, 4]);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 水タンク（クリアクリスタル調）
      const tankGrad = ctx.createRadialGradient(35, -18, 2, 35, -18, 22);
      tankGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
      tankGrad.addColorStop(0.6, 'rgba(228, 195, 139, 0.6)');
      tankGrad.addColorStop(1, 'rgba(184, 151, 126, 0.8)');

      ctx.fillStyle = tankGrad;
      ctx.beginPath();
      ctx.ellipse(35, -18, 22, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.stroke();

      // ノズル先端
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.rect(85, -6, 10, 12);
      ctx.fill();

      // グリップ
      ctx.fillStyle = '#8a5d14';
      ctx.beginPath();
      ctx.moveTo(10, 10);
      ctx.lineTo(0, 38);
      ctx.lineTo(15, 38);
      ctx.lineTo(25, 10);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // 出現中で全開のタイミング（progress 0.2〜0.85）で泡を噴射
      if (waterGun.progress > 0.2 && waterGun.progress < 0.85) {
        emitGunBubbles(waterGun.nozzleX, waterGun.nozzleY);
      }
    }

    // 泡を描画
    function drawBubble(ctx, x, y, size, colorPrefix, opacity, onFace) {
      ctx.save();
      ctx.translate(x, y);

      const alpha = onFace ? opacity * 0.1 : opacity;

      const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.05, 0, 0, size);
      grad.addColorStop(0, 'rgba(255, 255, 255, ' + (alpha * 0.8) + ')');
      grad.addColorStop(0.4, colorPrefix + (alpha * 0.25) + ')');
      grad.addColorStop(0.85, colorPrefix + (alpha * 0.55) + ')');
      grad.addColorStop(1, 'rgba(255, 255, 255, ' + (alpha * 0.9) + ')');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.85) + ')';
      ctx.beginPath();
      ctx.arc(-size * 0.38, -size * 0.38, size * 0.22, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 瞬くレンズフレアを描画
    function drawLensFlare(ctx, x, y, size, colorPrefix, opacity, twinklePhase, onFace) {
      ctx.save();
      ctx.translate(x, y);

      const twinkle = Math.sin(timeCount * 3 + twinklePhase) * 0.3 + 0.7;
      const currentOpacity = (onFace ? opacity * 0.1 : opacity) * twinkle;

      ctx.globalCompositeOperation = 'screen';

      const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.5);
      glowGrad.addColorStop(0, colorPrefix + (currentOpacity * 0.9) + ')');
      glowGrad.addColorStop(0.5, colorPrefix + (currentOpacity * 0.3) + ')');
      glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (currentOpacity * 0.95) + ')';
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(-size * 2.2, 0); ctx.lineTo(size * 2.2, 0);
      ctx.moveTo(0, -size * 2.2); ctx.lineTo(0, size * 2.2);
      ctx.stroke();

      ctx.strokeStyle = colorPrefix + (currentOpacity * 0.5) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-size * 1.1, -size * 1.1); ctx.lineTo(size * 1.1, size * 1.1);
      ctx.moveTo(size * 1.1, -size * 1.1); ctx.lineTo(-size * 1.1, size * 1.1);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- 水鉄砲 10秒周期タイマーロジック ---
      waterGun.timer += 0.016;
      if (waterGun.timer >= 10 && !waterGun.active) {
        waterGun.active = true;
        waterGun.progress = 0;
      }

      if (waterGun.active) {
        waterGun.progress += 0.016 / waterGun.duration;
        if (waterGun.progress >= 1) {
          waterGun.active = false;
          waterGun.timer = 0;
          waterGun.progress = 0;
        }
      }

      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.2);

      // 通常背景パーティクルの更新と描画
      particles.forEach((p) => {
        if (p.type === 'bubble') {
          p.y -= p.speedY * activeCount;
          p.x += Math.sin(timeCount * 2 + p.twinklePhase) * 0.6 * activeCount;
        } else {
          p.y -= p.speedY * activeCount * 0.5;
          p.x += p.speedX * activeCount * 0.3;
        }

        if (p.y < -50 || p.x < -50 || p.x > logicalWidth + 50) {
          p.y = logicalHeight + 40;
          p.x = Math.random() * logicalWidth;
          p.colorPrefix = bubbleRimColors[Math.floor(Math.random() * bubbleRimColors.length)];
        }

        p.onFace = false;
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        if (effectPowerLevel > 0) {
          if (p.type === 'bubble') {
            drawBubble(ctx, p.x, p.y, p.size, p.colorPrefix, p.opacity, p.onFace);
          } else {
            drawLensFlare(ctx, p.x, p.y, p.size, p.colorPrefix, p.baseOpacity, p.twinklePhase, p.onFace);
          }
        }
      });

      // 水鉄砲描画
      if (effectPowerLevel > 0) {
        drawWaterGun(ctx, logicalWidth, logicalHeight);
      }

      // 噴射された泡の更新と描画
      for (let i = shotBubbles.length - 1; i >= 0; i--) {
        const sb = shotBubbles[i];
        sb.x += sb.vx;
        sb.y += sb.vy;
        sb.vy -= 0.08; // 浮力で次第に上に向かう
        sb.vx *= 0.98; // 空気抵抗
        sb.opacity -= 0.005;

        sb.onFace = false;
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (sb.x > x && sb.x < x + width && sb.y > y && sb.y < y + height) {
              sb.onFace = true;
              break;
            }
          }
        }

        if (sb.opacity <= 0 || sb.y < -30) {
          shotBubbles.splice(i, 1);
        } else if (effectPowerLevel > 0) {
          drawBubble(ctx, sb.x, sb.y, sb.size, sb.colorPrefix, sb.opacity, sb.onFace);
        }
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像を描画
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. 現在の泡＆レンズフレア＆水鉄砲AR演出を合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPGで自動保存
      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.92);
      const link = document.createElement('a');
      link.download = 'luxury_pro_bubble_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED (Check Library)";

      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 3000);
    });

    // 初期化実行
    initCamera();

  </script>
</body>
</html>
