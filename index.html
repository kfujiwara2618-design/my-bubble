<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Hose & Bubble Flare HD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み (人物認識用) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">MODEL LOADING...</span> | JPG保存 | 顔認識エフェクト回避
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識 (Face-api.js) の実装 ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);

      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズームの実装 ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- Canvas リサイズ ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクト強弱設定 ---
    let effectPowerLevel = 2; // 1: Low, 2: Mid, 3: High
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    // --- 泡 & レンズフレア パーティクルシステム ---
    const particles = [];
    let timeCount = 0;

    const bubbleRimColors = [
      'rgba(255, 235, 190, ', 
      'rgba(228, 195, 139, ', 
      'rgba(255, 255, 255, ', 
      'rgba(200, 230, 255, '
    ];

    // ホースのノズル位置（スクリーンの左下付近）
    function getNozzlePosition() {
      return {
        x: window.innerWidth * 0.18,
        y: window.innerHeight * 0.78
      };
    }

    function createParticle(isInitial = false) {
      const nozzle = getNozzlePosition();
      const isFlare = Math.random() < 0.3; // 30%でレンズフレア

      // 初期化時以外はノズル先端から発生
      const startX = isInitial ? Math.random() * window.innerWidth : nozzle.x + (Math.random() - 0.5) * 20;
      const startY = isInitial ? Math.random() * window.innerHeight : nozzle.y + (Math.random() - 0.5) * 20;

      // 噴射の初期速度（右上方向へ勢いよく飛び出す）
      const angle = -Math.PI / 3 + (Math.random() - 0.5) * 0.6; // 約60度上向き
      const speed = isInitial ? (Math.random() * 1.5 + 0.5) : (Math.random() * 6.0 + 3.0);

      return {
        type: isFlare ? 'flare' : 'bubble',
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: isFlare ? (Math.random() * 22 + 8) : (Math.random() * 26 + 6),
        opacity: Math.random() * 0.6 + 0.4,
        baseOpacity: Math.random() * 0.5 + 0.4,
        twinklePhase: Math.random() * Math.PI * 2,
        colorPrefix: bubbleRimColors[Math.floor(Math.random() * bubbleRimColors.length)],
        onFace: false
      };
    }

    for (let i = 0; i < 90; i++) {
      particles.push(createParticle(true));
    }

    // --- ラグジュアリーなゴールド・ブラス調ホースの描画 ---
    function drawHose(ctx) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const nozzle = getNozzlePosition();

      ctx.save();

      // 1. ホース本体（曲線のパイプ）
      ctx.beginPath();
      ctx.moveTo(-20, h + 20);
      ctx.bezierCurveTo(w * 0.05, h * 0.9, w * 0.08, h * 0.85, nozzle.x, nozzle.y);
      ctx.lineWidth = 28;
      ctx.strokeStyle = '#1a1815';
      ctx.lineCap = 'round';
      ctx.stroke();

      // ホースのメタリックなグラデーションハイライト
      const hoseGrad = ctx.createLinearGradient(0, h, nozzle.x, nozzle.y);
      hoseGrad.addColorStop(0, '#3a3227');
      hoseGrad.addColorStop(0.5, '#8c7352');
      hoseGrad.addColorStop(1, '#2a2218');

      ctx.beginPath();
      ctx.moveTo(-20, h + 20);
      ctx.bezierCurveTo(w * 0.05, h * 0.9, w * 0.08, h * 0.85, nozzle.x, nozzle.y);
      ctx.lineWidth = 20;
      ctx.strokeStyle = hoseGrad;
      ctx.stroke();

      // 2. 金色のラグジュアリーノズル先端
      ctx.translate(nozzle.x, nozzle.y);
      ctx.rotate(-Math.PI / 3.2);

      // 真鍮金色のグラデーション
      const goldGrad = ctx.createLinearGradient(-12, -15, 12, 15);
      goldGrad.addColorStop(0, '#fff3a8');
      goldGrad.addColorStop(0.4, '#e4c38b');
      goldGrad.addColorStop(0.8, '#b8977e');
      goldGrad.addColorStop(1, '#5c4528');

      ctx.fillStyle = goldGrad;
      ctx.beginPath();
      ctx.roundRect(-12, -25, 24, 35, [4, 4, 2, 2]);
      ctx.fill();

      // ノズルの金属リング装飾
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.6;
      ctx.fillRect(-12, -20, 24, 3);
      ctx.fillRect(-12, -10, 24, 2);

      ctx.restore();
    }

    // --- 泡の描画 ---
    function drawBubble(ctx, x, y, size, colorPrefix, opacity, onFace) {
      ctx.save();
      ctx.translate(x, y);

      const alpha = onFace ? opacity * 0.1 : opacity;

      const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.05, 0, 0, size);
      grad.addColorStop(0, 'rgba(255, 255, 255, ' + (alpha * 0.85) + ')');
      grad.addColorStop(0.4, colorPrefix + (alpha * 0.25) + ')');
      grad.addColorStop(0.85, colorPrefix + (alpha * 0.55) + ')');
      grad.addColorStop(1, 'rgba(255, 255, 255, ' + (alpha * 0.95) + ')');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();

      // 光沢ハイライト
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.9) + ')';
      ctx.beginPath();
      ctx.arc(-size * 0.38, -size * 0.38, size * 0.22, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- 瞬くレンズフレアの描画 ---
    function drawLensFlare(ctx, x, y, size, colorPrefix, opacity, twinklePhase, onFace) {
      ctx.save();
      ctx.translate(x, y);

      const twinkle = Math.sin(timeCount * 3.5 + twinklePhase) * 0.35 + 0.65;
      const currentOpacity = (onFace ? opacity * 0.1 : opacity) * twinkle;

      ctx.globalCompositeOperation = 'screen';

      const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.6);
      glowGrad.addColorStop(0, colorPrefix + (currentOpacity * 0.95) + ')');
      glowGrad.addColorStop(0.5, colorPrefix + (currentOpacity * 0.3) + ')');
      glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.6, 0, Math.PI * 2);
      ctx.fill();

      // 光芒
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (currentOpacity * 0.9) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-size * 2.2, 0); ctx.lineTo(size * 2.2, 0);
      ctx.moveTo(0, -size * 2.2); ctx.lineTo(0, size * 2.2);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.22, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.8 : 1.4);

      // パーティクルの更新と描画
      particles.forEach((p, idx) => {
        // 速度の減衰と上昇（空気抵抗と浮力）
        p.vx *= 0.96;
        p.vy *= 0.96;

        if (p.type === 'bubble') {
          p.vy -= 0.08 * activeCount; // 浮力で浮上
          p.vx += Math.sin(timeCount * 2.5 + p.twinklePhase) * 0.2;
        } else {
          p.vy -= 0.03 * activeCount;
        }

        p.x += p.vx * activeCount;
        p.y += p.vy * activeCount;

        // 画面外へ出たらノズルからリスポーン
        if (p.y < -50 || p.x > logicalWidth + 50 || p.x < -50) {
          particles[idx] = createParticle(false);
        }

        // 顔認識回避
        p.onFace = false;
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        if (effectPowerLevel > 0) {
          if (p.type === 'bubble') {
            drawBubble(ctx, p.x, p.y, p.size, p.colorPrefix, p.opacity, p.onFace);
          } else {
            drawLensFlare(ctx, p.x, p.y, p.size, p.colorPrefix, p.baseOpacity, p.twinklePhase, p.onFace);
          }
        }
      });

      // 最後にホースを描画（パーティクルの後ろ・前に自然に配置）
      if (effectPowerLevel > 0) {
        drawHose(ctx);
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. AR演出（ホース・泡・レンズフレア）の合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPG保存
      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.92);
      const link = document.createElement('a');
      link.download = 'luxury_pro_hose_bubble_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED (Check Library)";

      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 3000);
    });

    // 初期化実行
    initCamera();

  </script>
</body>
</html>
